config-version = 2

start-at-login = false
auto-reload-config = true


# ============================================================
# Window / Layout
# ============================================================

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'


# Move cursor to the center when changing monitor
on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center'
]

automatically-unhide-macos-hidden-apps = false


# ============================================================
# Workspaces
# ============================================================


persistent-workspaces = [
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7",
  "8",
  "9",

  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
]


# ============================================================
# Dynamic Monitor Assignment
# ============================================================


[workspace-to-monitor-force-assignment]

1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'

A = 'secondary'
B = 'secondary'
C = 'secondary'
D = 'secondary'
E = 'secondary'
F = 'secondary'


# ============================================================
# Key Mapping
# ============================================================

[key-mapping]
preset = 'qwerty'


# ============================================================
# Gaps
# ============================================================

[gaps]

inner.horizontal = 10
inner.vertical = 10

outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10


# ============================================================
# MAIN MODE
# ============================================================

[mode.main.binding]


# ------------------------------------------------------------
# Layout
# ------------------------------------------------------------

# Toggle tiles orientation
alt-slash = 'layout tiles horizontal vertical'

# Toggle accordion
alt-comma = 'layout accordion horizontal vertical'

# Fullscreen
alt-f = 'fullscreen'

# Toggle floating / tiling
alt-shift-f = 'layout floating tiling'


# ------------------------------------------------------------
# Window Focus
# ------------------------------------------------------------

# Vim-style navigation

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'


# ------------------------------------------------------------
# Move Windows
# ------------------------------------------------------------

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'


# ------------------------------------------------------------
# Resize
# ------------------------------------------------------------

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Reset to equal size
alt-0 = 'balance-sizes'


# ============================================================
# MAIN DISPLAY WORKSPACES
# ============================================================
#
# 1-9 always belong to the macOS Main Display.
#
# This is dynamic — it doesn't matter which physical monitor
# macOS considers the Main Display.
# ============================================================

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'


# ============================================================
# SECONDARY DISPLAY WORKSPACES
# ============================================================
#
# A-F always belong to the secondary monitor.
#
# Usually this will be your MacBook display.
# ============================================================

alt-a = 'workspace A'
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-d = 'workspace D'
alt-e = 'workspace E'


# ============================================================
# MOVE WINDOW → MAIN DISPLAY
# ============================================================
#
# ALT + SHIFT + number
#
# Move the currently focused window to a workspace on the
# Main Display and switch there.
# ============================================================

alt-shift-1 = [
  'move-node-to-workspace 1',
  'workspace 1'
]

alt-shift-2 = [
  'move-node-to-workspace 2',
  'workspace 2'
]

alt-shift-3 = [
  'move-node-to-workspace 3',
  'workspace 3'
]

alt-shift-4 = [
  'move-node-to-workspace 4',
  'workspace 4'
]

alt-shift-5 = [
  'move-node-to-workspace 5',
  'workspace 5'
]

alt-shift-6 = [
  'move-node-to-workspace 6',
  'workspace 6'
]

alt-shift-7 = [
  'move-node-to-workspace 7',
  'workspace 7'
]

alt-shift-8 = [
  'move-node-to-workspace 8',
  'workspace 8'
]

alt-shift-9 = [
  'move-node-to-workspace 9',
  'workspace 9'
]


# ============================================================
# MOVE WINDOW → SECONDARY DISPLAY
# ============================================================


alt-shift-a = [
  'move-node-to-workspace A',
  'workspace A'
]

alt-shift-b = [
  'move-node-to-workspace B',
  'workspace B'
]

alt-shift-c = [
  'move-node-to-workspace C',
  'workspace C'
]

alt-shift-d = [
  'move-node-to-workspace D',
  'workspace D'
]

alt-shift-e = [
  'move-node-to-workspace E',
  'workspace E'
]

# ============================================================
# WORKSPACE HISTORY
# ============================================================

# Jump back to previous workspace

alt-tab = 'workspace-back-and-forth'


# ============================================================
# MONITOR MANAGEMENT
# ============================================================

# Move current workspace to previous monitor
alt-shift-left = [
  'move-workspace-to-monitor --wrap-around prev',
  'focus-monitor prev',
  'move-mouse monitor-lazy-center'
]

# Move current workspace to next monitor
alt-shift-right = [
  'move-workspace-to-monitor --wrap-around next',
  'focus-monitor next',
  'move-mouse monitor-lazy-center'
]


# Move current window to previous monitor
alt-shift-up = [
  'move-node-to-monitor prev',
  'focus-monitor prev',
  'move-mouse monitor-lazy-center'
]

# Move current window to next monitor
alt-shift-down = [
  'move-node-to-monitor next',
  'focus-monitor next',
  'move-mouse monitor-lazy-center'
]


# ============================================================
# SERVICE MODE
# ============================================================

alt-shift-semicolon = 'mode service'


# ============================================================
# SERVICE MODE
# ============================================================

[mode.service.binding]


# Exit service mode
esc = [
  'reload-config',
  'mode main'
]


# Reset layout
r = [
  'flatten-workspace-tree',
  'mode main'
]


# Toggle floating / tiling
f = [
  'layout floating tiling',
  'mode main'
]


# Close everything except current window
backspace = [
  'close-all-windows-but-current',
  'mode main'
]


# ------------------------------------------------------------
# Join Containers
# ------------------------------------------------------------

alt-shift-h = [
  'join-with left',
  'mode main'
]

alt-shift-j = [
  'join-with down',
  'mode main'
]

alt-shift-k = [
  'join-with up',
  'mode main'
]

alt-shift-l = [
  'join-with right',
  'mode main'
]
