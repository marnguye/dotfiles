config-version = 2

start-at-login = false

# Window / Layout
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Workspaces — must be before [gaps]
persistent-workspaces = [
  "1", "2", "3", "4", "5", "6", "7", "8", "9",
  "A", "B", "C", "D", "E", "F",
]

[gaps]
inner.horizontal = 12
inner.vertical   = 12
outer.left       = 12
outer.bottom     = 12
outer.top        = 12
outer.right      = 12

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
A = 'secondary'
B = 'secondary'
C = 'secondary'
D = 'secondary'
E = 'secondary'
F = 'secondary'

[key-mapping]
preset = 'qwerty'

[mode.main.binding]

# Layout
alt-slash   = 'layout tiles horizontal vertical'
alt-comma   = 'layout accordion horizontal vertical'
alt-f       = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-0     = 'balance-sizes'

# Main display
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Secondary display
alt-a = 'workspace A'
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-d = 'workspace D'
alt-e = 'workspace E'

# Move to main
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Move to secondary
alt-shift-a = ['move-node-to-workspace A', 'workspace A']
alt-shift-b = ['move-node-to-workspace B', 'workspace B']
alt-shift-c = ['move-node-to-workspace C', 'workspace C']
alt-shift-d = ['move-node-to-workspace D', 'workspace D']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']

# Workspace history
alt-tab = 'workspace-back-and-forth'

# Monitor management
alt-shift-left  = ['move-workspace-to-monitor --wrap-around prev', 'focus-monitor prev', 'move-mouse monitor-lazy-center']
alt-shift-right = ['move-workspace-to-monitor --wrap-around next', 'focus-monitor next', 'move-mouse monitor-lazy-center']
alt-shift-up    = ['move-node-to-monitor prev', 'focus-monitor prev', 'move-mouse monitor-lazy-center']
alt-shift-down  = ['move-node-to-monitor next', 'focus-monitor next', 'move-mouse monitor-lazy-center']

# Floating resize
alt-ctrl-minus = 'resize smart -30'
alt-ctrl-equal = 'resize smart +30'

# Service mode
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left',  'mode main']
alt-shift-j = ['join-with down',  'mode main']
alt-shift-k = ['join-with up',    'mode main']
alt-shift-l = ['join-with right', 'mode main']
