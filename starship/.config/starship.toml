"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$golang\
$python\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "tokyonight"
scan_timeout = 30
command_timeout = 500

[directory]
style = "bold fg:white bg:blue"
format = "[ 󰉋 $path ]($style)"
repo_root_format = "[ 󰉋 $repo_root ]($style)[$path](bold fg:blue_light)"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = true
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "Downloads"
"Desktop" = "󰇄 Desktop"

[git_branch]
symbol = " "
style = "bold fg:white bg:git_bg"
format = "[ $symbol$branch ]($style)"
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "fg:yellow"
format = " $all_status$ahead_behind"
conflicted = "[⚡${count}](bold fg:red) "
ahead = "[⇡${count}](bold fg:blue) "
behind = "[⇣${count}](bold fg:purple) "
diverged = "[⇡${ahead_count}⇣${behind_count}](bold fg:orange) "
untracked = "[?${count}](fg:gray) "
stashed = "[󰏗${count}](fg:purple) "
modified = "[!${count}](bold fg:yellow) "
staged = "[+${count}](bold fg:green) "
deleted = "[✘${count}](bold fg:red) "
renamed = "[»${count}](fg:teal) "

[fill]
symbol = " "

[nodejs]
symbol = "󰎙 "
style = "bold fg:teal"
format = "[ $symbol$version ]($style)"
version_format = "v${major}.${minor}"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[golang]
symbol = "󰟓 "
style = "fg:blue_light"
format = "[ $symbol$version ]($style)"
version_format = "v${major}.${minor}"
detect_files = ["go.mod", "go.work"]

[python]
symbol = "󰌠 "
style = "fg:yellow"
format = "[ $symbol$version ]($style)"
version_format = "v${major}.${minor}"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]
detect_folders = [".venv", "venv"]

[rust]
symbol = "󱘗 "
style = "fg:orange"
format = "[ $symbol$version ]($style)"
version_format = "v${major}.${minor}"
detect_files = ["Cargo.toml"]

[docker_context]
symbol = "󰡨 "
style = "fg:teal"
format = "[ $symbol$context ]($style)"
only_with_files = true

[cmd_duration]
min_time = 2000
style = "fg:gray"
format = "[ 󱦟 $duration ]($style)"
show_milliseconds = false

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:purple)"

[username]
disabled = true

[hostname]
disabled = true

[time]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[lua]
disabled = true

[haskell]
disabled = true

[ruby]
disabled = true

[jobs]
disabled = true

[palettes.tokyonight]
blue = "#3d59a1"
blue_light = "#7aa2f7"
git_bg = "#283457"
teal = "#73daca"
red = "#f7768e"
orange = "#ff9e64"
green = "#9ece6a"
yellow = "#e0af68"
purple = "#bb9af7"
gray = "#8b93b9"
white = "#c0caf5"
black = "#16161e"
