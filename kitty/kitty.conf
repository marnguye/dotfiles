# --- Fonts ---

font_family family="JetBrainsMono Nerd Font"
font_size 14.0


# --- Colors ---

background       #16161e
foreground       #c0caf5
cursor           #F5C842

selection_bg     #283457
selection_fg     #c0caf5


# --- ANSI Colors ---

color0  #15161e
color8  #414868

color1  #f7768e
color9  #f7768e

color2  #73daca
color10 #73daca

color3  #e0af68
color11 #e0af68

color4  #7aa2f7
color12 #7aa2f7

color5  #bb9af7
color13 #bb9af7

color6  #7dcfff
color14 #7dcfff

color7  #a9b1d6
color15 #c0caf5


# --- Window Layout ---

window_padding_width 8

enabled_layouts splits:split_axis=horizontal


# --- Window Borders ---

active_border_color   #7aa2f7
inactive_border_color #292e42
bell_border_color     #f7768e

draw_minimal_borders yes
window_border_width 1.0pt


# --- Tab Bar ---

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

active_tab_foreground   #16161e
active_tab_background   #7aa2f7
active_tab_font_style   bold

inactive_tab_foreground #565f89
inactive_tab_background #1f2335
inactive_tab_font_style normal


# --- macOS ---

hide_window_decorations yes
macos_titlebar_color background
macos_option_as_alt yes


# --- Performance ---

repaint_delay 8
input_delay 3
sync_to_monitor yes


# --- Resize ---

map alt+left  resize_window narrower 2
map alt+right resize_window wider 2
map alt+up    resize_window taller 2
map alt+down  resize_window shorter 2

map alt+= resize_window reset


# --- Tabs ---

map cmd+t new_tab_with_cwd
map cmd+w close_tab

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5


# --- Splits ---

map cmd+shift+enter launch --location=vsplit --cwd=current
map cmd+enter launch --location=hsplit --cwd=current

map cmd+[ previous_window
map cmd+] next_window

map cmd+shift+l layout_action rotate


# --- Config ---

map cmd+shift+r load_config_file
